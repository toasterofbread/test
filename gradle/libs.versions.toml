kotlin = "2.1.0"
compose = "1.8.0-dev1905"
agp = "8.7.2"
vanniktech-publish = "0.29.0"
composekit = "a0928b5d"
kogit = "0.0.3-SNAPSHOT"
ktor = "3.0.1"
okio = "3.9.1"
sqldelight = "2.1.0-SNAPSHOT"
sqldelight-wasm = "f363703160" # TEMP SqlDelight
undercouch-download = "5.6.0"
image-loader = "1.9.0"
diff = "0.7.0"
uri-kmp = "0.0.18"

mokkery = "2.6.0-SNAPSHOT"
assertk = "0.28.1"

markdown = "0.7.3"
kotlinx-datetime = "0.6.0"
kotlinx-coroutines = "1.9.0"
kotlinx-serialization-json = "1.7.3"
androidx-activity-compose = "1.9.3"
navigation-common-ktx = "2.8.4"

[libraries]
composekit-util = { module = "dev.toastbits:composekit-util", version.ref = "composekit" }
