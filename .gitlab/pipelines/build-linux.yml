image: gradle:jdk17

before_script:
  - export GRADLE_USER_HOME=$(pwd)/.gradle
  - chmod +x ./gradlew

cache:
  key: "$CI_COMMIT_REF_NAME"
  paths:
    - .gradle/

build-linux:
  stage: build
  only:
    - main
  script:
    - ./gradlew packageUberJarForCurrentOS packageReleaseUberJarForCurrentOS
  artifacts:
    paths:
      - application/app/build/outputs/jar/*.jar
